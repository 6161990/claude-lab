name: OneOnOne Dev Build

on:
  push:
    branches: [ main ]
    paths:
      - 'OneOnOne/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_ENABLED: ${{ secrets.JIRA_ENABLED }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('OneOnOne/backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradle 빌드
        working-directory: OneOnOne/backend
        run: ./gradlew build
