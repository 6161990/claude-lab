server:
  port: 8080
  error:
    include-message: always
  tomcat:
    max-http-form-post-size: -1  # 무제한 (Tomcat 기본값이 Spring 설정보다 먼저 적용됨)

spring:
  application:
    name: oneonone-backend

  # 파일 업로드 (GitHub 저장소 ZIP 기준 — 권장 300MB 이하)
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 2GB
      file-size-threshold: 10MB
      location: ${java.io.tmpdir}

# ZIP 업로드 검증
upload:
  max-zip-size-mb: 500        # 파일 1개당 최대 크기 (MB)
  max-zip-count: 3             # 동시 업로드 최대 개수

# 로깅
logging:
  level:
    root: INFO
    com.oneonone: DEBUG

# Jira/Confluence 연동
# JIRA_EMAIL = Jira API 인증용 서비스 계정 이메일 (웹 폼의 '분석 대상 이메일'과 무관)
jira:
  base-url: ${JIRA_BASE_URL:}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}
  enabled: ${JIRA_ENABLED:false}

# Anthropic Claude API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
